# Push to {{BRANCH}} -> build + push image to GHCR -> SSH deploy to the Hostinger VPS.
# Generated from the `hostinger` skill template.
#
# Repo secrets (set by the skill's scripts/setup-deploy-access.sh):
#   SSH_HOST         the VPS hostname
#   SSH_USER         deploy user
#   SSH_PRIVATE_KEY  dedicated ed25519 key for this repo
#   SSH_KNOWN_HOSTS  ssh-keyscan output for SSH_HOST (pinned, no TOFU)
name: deploy

on:
  push:
    branches: [{{BRANCH}}]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-{{APP}}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/{{GH_OWNER}}/{{APP}}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:{{BRANCH}}
            ${{ env.IMAGE }}:{{BRANCH}}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Force IPv4: Hostinger VPS hostnames have AAAA records, but some GitHub
          # runners have no IPv6 route ("Network is unreachable" after a long hang).
          printf 'Host *\n  AddressFamily inet\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Sync deploy/ to the VPS
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          # Never touch VPS-local state: data/ and .env.
          rsync -az --delete --exclude 'data/' --exclude '.env' \
            deploy/ "$TARGET:/docker/{{APP}}/"

      - name: Deploy
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh "$TARGET" "IMAGE_TAG={{BRANCH}}-${{ github.sha }} /docker/{{APP}}/scripts/deploy.sh"
